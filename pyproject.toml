# pyproject.toml

[tool.poetry]
name = "airontools"
version = "0.1.72"
description = "AIronTools (Beta) is a Python library that provides the user with deep learning tools built to work with tensorflow as a backend."
authors = ["Claudi"]
readme = "README.md"
license = "BSD"
repository = "https://github.com/AtrejuArtax/airontools"
classifiers= [
        "License :: OSI Approved :: BSD License",
        "Operating System :: OS Independent",
        "Programming Language :: Python :: 3",
]

[tool.poetry.dependencies]
python = ">=3.11"
scikit-learn = "^1.2.2"
h5py = "^3.10.0"
tensorflow = [
    # 1. Linux x86_64 & Windows WSL2 (Cloud GPU / Dev Environments) -> Gets CUDA
    { version = "2.18.1", extras = ["and-cuda"], markers = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
    # 2. Everyone Else (Windows Native, Mac Apple Silicon, Linux ARM64) -> Standard CPU/Metal
    { version = "2.18.1", markers = "sys_platform != 'linux' or platform_machine != 'x86_64'" }
]
tensorflow-metal = { version = "1.2.0", markers = "sys_platform == 'darwin' and platform_machine == 'arm64'" }
keras = "^3.13.2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.1.1"
pip = "^23.1.2"
black = "^24.2.0"
twine = "^5.1.1"
isort = "^5.13.2"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.isort]
profile = "black"